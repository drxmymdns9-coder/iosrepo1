workflows:
  ios-unsigned-ipa:
    name: Anilili iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 26.4
    scripts:
      - name: Install xtool
        script: |
          set -euxo pipefail
          brew install xtool-org/tap/xtool
      - name: Generate Xcode project
        script: |
          set -euxo pipefail
          xtool dev generate-xcode-project
          test -f xtool/Anilili.xcworkspace/contents.xcworkspacedata
      - name: Build unsigned app
        script: |
          set -euxo pipefail
          mkdir -p .build/xcode
          xcodebuild \
            -workspace xtool/Anilili.xcworkspace \
            -scheme Anilili-App \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log
      - name: Package unsigned IPA
        script: |
          set -euxo pipefail
          product_dir=.build/xcode/Build/Products/Release-iphoneos
          apps=("$product_dir"/*.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          test -f "$app/Info.plist"
          test -x "$app/Anilili"
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          ditto "$app" build/ios/ipa/Payload/"$(basename "$app")"
          test -f build/ios/ipa/Payload/Anilili.app/Info.plist
          test -x build/ios/ipa/Payload/Anilili.app/Anilili
          (cd build/ios/ipa && zip -qryX ../Anilili-unsigned.ipa Payload)
          test -s build/ios/Anilili-unsigned.ipa
          unzip -t build/ios/Anilili-unsigned.ipa
          unzip -l build/ios/Anilili-unsigned.ipa | grep -F 'Payload/Anilili.app/Info.plist'
    artifacts:
      - build/ios/Anilili-unsigned.ipa
      - xcodebuild.log
