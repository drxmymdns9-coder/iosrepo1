name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Installed Xcodes:"
          ls -1d /Applications/Xcode*.app 2>/dev/null || true
          xcode_app=/Applications/Xcode_16.4.app
          if [ ! -d "$xcode_app" ]; then
            xcode_app=/Applications/Xcode.app
          fi
          echo "Using $xcode_app"
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      - name: Generate Xcode project
        run: |
          set -euxo pipefail
          xtool dev generate-xcode-project
          test -f xtool/Anilili.xcworkspace/contents.xcworkspacedata

      - name: Build unsigned app
        run: |
          set -euxo pipefail
          mkdir -p .build/xcode
          xcodebuild \
            -workspace xtool/Anilili.xcworkspace \
            -scheme Anilili-App \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild.log

      - name: Package IPA
        run: |
          set -euxo pipefail
          product_dir=.build/xcode/Build/Products/Release-iphoneos
          apps=("$product_dir"/*.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          app_name="$(basename "$app")"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          test -n "$executable"
          test -x "$app/$executable"
          rm -rf xtool/ipa
          mkdir -p xtool/ipa/Payload
          ditto "$app" "xtool/ipa/Payload/$app_name"
          test -f "xtool/ipa/Payload/$app_name/Info.plist"
          test -x "xtool/ipa/Payload/$app_name/$executable"
          (cd xtool/ipa && zip -qryX ../Anilili.ipa Payload)
          test -s xtool/Anilili.ipa
          unzip -t xtool/Anilili.ipa
          unzip -l xtool/Anilili.ipa | grep -F "Payload/$app_name/Info.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Anilili-iOS-unsigned-IPA
          path: xtool/Anilili.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
