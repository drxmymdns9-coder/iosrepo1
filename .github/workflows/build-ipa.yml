name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Installed Xcodes:"
          ls -1d /Applications/Xcode*.app 2>/dev/null || true
          xcode_app=/Applications/Xcode_16.4.app
          if [ ! -d "$xcode_app" ]; then
            xcode_app=/Applications/Xcode.app
          fi
          echo "Using $xcode_app"
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install xtool
        run: brew install xtool-org/tap/xtool

      - name: Generate Xcode project
        run: |
          set -euxo pipefail
          xtool dev generate-xcode-project
          test -f xtool/Anilili.xcworkspace/contents.xcworkspacedata

      - name: Build unsigned app
        run: |
          set -euxo pipefail
          mkdir -p .build/xcode
          xcodebuild \
            -workspace xtool/Anilili.xcworkspace \
            -scheme Anilili-App \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Package IPA
        run: |
          set -euxo pipefail
          app=$(find .build/xcode/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$app"
          mkdir -p xtool/ipa/Payload
          cp -R "$app" xtool/ipa/Payload/
          (cd xtool/ipa && zip -qryX ../Anilili.ipa Payload)
          test -s xtool/Anilili.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Anilili-iOS-unsigned-IPA
          path: xtool/Anilili.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
